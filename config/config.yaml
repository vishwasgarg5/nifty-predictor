# ============================================================
# PRODUCTION MODEL REGISTRY
# ============================================================

model_registry:

  enabled: true

  # Persistent registry containing the active production Champion.
  path: data/models/model_registry.json

  # Keep a history of model promotion and rollback events.
  keep_history: true


# ============================================================
# PRODUCTION MODEL LOADING
# ============================================================

models:

  # Dynamic production model registry.
  registry_path: data/models/model_registry.json

  # During initial deployment, allow the existing per-symbol
  # ModelStore models when no production Champion is registered.
  require_champion: false

  # Existing model loading remains available as a fallback.
  allow_fallback_model: true

  # Cache loaded production models within a running process.
  cache_enabled: true


# ============================================================
# CHAMPION / CHALLENGER
# ============================================================

champion_challenger:

  enabled: true

  # Legacy/current logical model names.
  champion: current
  challenger: challenger_v1

  minimum_evaluations: 30
  comparison_window: 50

  # Challenger must outperform the Champion by at least 2%.
  minimum_improvement: 0.02

  evaluate_return_mae: true
  evaluate_direction_accuracy: true
  evaluate_brier_score: true
  evaluate_risk_mae: true

  # Promotion remains controlled until the production loader
  # has been fully validated.
  auto_promote: false
  require_manual_approval: true

  # After promotion, the registry becomes the source of truth.
  use_model_registry: true
