# ============================================================
# STOCK PREDICTION SYSTEM CONFIGURATION
# ============================================================

project:
  name: nse-stock-prediction-system
  version: "1.0"
  timezone: "Asia/Kolkata"


# ============================================================
# DATA SOURCES
# ============================================================

data_sources:

  yahoo:
    enabled: true

  nse:
    enabled: true

  news:
    enabled: true


# ============================================================
# STOCK UNIVERSES
# ============================================================

universes:

  primary:
    - nifty100
    - nifty500

  secondary:
    - midcap150

  ipo:
    enabled: true
    max_age_days: 730
    min_trading_days: 30


indexes:

  - "^NSEI"
  - "^NSEBANK"


# ============================================================
# IPO DESK
# ============================================================

ipo_desk:

  enabled: true

  max_age_days: 730

  min_history_days: 30

  include_recent_ipos: true


# ============================================================
# PIPELINE LIMITS
# ============================================================

top_n: 5

lookback_days: 365

min_history_days: 120

liquidity:

  enabled: true

  minimum_price: 20

  minimum_average_volume: 100000


universe_filter:

  enabled: true

  max_symbols: 1000


# ============================================================
# FEATURE ENGINE
# ============================================================

features:

  enabled: true

  technical: true

  fundamental: true

  news: true

  point_in_time: true


technical:

  sma_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200

  ema_periods:
    - 10
    - 20
    - 50

  rsi_period: 14

  volatility_period: 20

  momentum_periods:
    - 5
    - 10
    - 20

  volume_period: 20


point_in_time:

  enabled: true

  strict: true


# ============================================================
# MARKET REGIME
# ============================================================

market_regime:

  enabled: true

  index: "^NSEI"

  lookback_days: 100

  volatility_window: 20

  trend_fast: 20

  trend_slow: 50


# ============================================================
# SCORING
# ============================================================

scoring:

  stage1_limit: 250

  prefilter_top: 40

  weights:

    technical: 0.70

    fundamental: 0.30


# ============================================================
# MACHINE LEARNING
# ============================================================

models:

  enabled: true

  active_model: "ohlc-v1"

  return_model: true

  direction_model: true

  risk_model: true

  ensemble: true


model:

  name: "ohlc-v1"

  version: "1.0"

  retrain_enabled: true


# ============================================================
# CONFIDENCE
# ============================================================

confidence:

  enabled: true

  minimum_score: 0.50


# ============================================================
# OPPORTUNITY SCORE
# ============================================================

opportunity:

  enabled: true

  minimum_score: 0.50


# ============================================================
# QUALITY GATE
# ============================================================

quality_gate:

  enabled: true

  minimum_confidence: 0.50

  minimum_opportunity_score: 0.50


# ============================================================
# SECTOR DIVERSIFICATION
# ============================================================

sector_diversification:

  enabled: true

  max_per_sector: 2


# ============================================================
# PREDICTION LEDGER
# ============================================================

ledger:

  enabled: true

  auto_create: true

  evaluate_after_market_close: true


# ============================================================
# EVALUATION
# ============================================================

evaluation:

  enabled: true

  recent_window: 50

  save_reports: true


# ============================================================
# DRIFT DETECTION
# ============================================================

drift:

  enabled: true

  minimum_samples: 20

  feature_drift_threshold: 0.20

  performance_drift_threshold: 0.10


# ============================================================
# CHAMPION / CHALLENGER
# ============================================================

champion_challenger:

  enabled: true

  minimum_samples: 20

  promotion_margin: 0.02


# ============================================================
# MODEL TUNING
# ============================================================

tuning:

  enabled: true

  weekly_enabled: true

  minimum_samples: 50


# ============================================================
# SENTIMENT / NEWS
# ============================================================

sentiment:

  enabled: true

  lookback_hours: 24

  minimum_articles: 1


# ============================================================
# PRODUCTION MONITORING
# ============================================================

monitoring:

  enabled: true

  paths:

    ledger: data/ledger/predictions.csv

    reports: data/reports

    registry: data/model_registry.json

    monitoring: data/monitoring


  thresholds:

    minimum_direction_accuracy: 0.45

    maximum_return_mae: 0.10

    maximum_brier_score: 0.30

    maximum_risk_mae: 0.10

    maximum_pending_predictions: 100

    minimum_evaluated_predictions: 10


  health:

    healthy_score: 80

    warning_score: 50


# ============================================================
# TELEGRAM ALERTS
# ============================================================

telegram_alerts:

  enabled: true

  # INFO / WARNING / CRITICAL
  minimum_level: CRITICAL

  # Avoid daily Telegram spam.
  send_healthy_report: false


# ============================================================
# TELEGRAM PREDICTIONS
# ============================================================

telegram:

  enabled: true

  send_predictions: true

  send_errors: true


# ============================================================
# PIPELINE PATHS
# ============================================================

paths:

  predictions: data/predictions

  history: data/history

  models: data/models

  universes_dir: data/universes

  reports: data/reports

  monitoring: data/monitoring

  ledger_file: data/ledger/predictions.csv

  metrics_file: data/reports/latest_evaluation.csv

  weekly_file: data/reports/weekly_evaluation.csv

  drift_file: data/reports/latest_drift.json

  ipo_file: data/ipo/ipos.csv

  ipo_pipeline: data/ipo

  registry_file: data/model_registry.json

  errors_file: logs/errors.log


# ============================================================
# LOGGING
# ============================================================

logging:

  level: INFO

  directory: logs

  file: logs/pipeline.log
