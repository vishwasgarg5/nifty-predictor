# ============================================================
# AI STOCK PREDICTION SYSTEM
# MASTER CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# PROJECT
# ------------------------------------------------------------

project:
  name: AI Stock Prediction System
  version: "4.2"
  market: NSE
  timezone: Asia/Kolkata


# ============================================================
# PATHS
# ============================================================

paths:

  # Historical / cached market data
  data: data

  # Daily prediction CSV files
  predictions: data/predictions

  # Persistent trained ML models
  models: data/models

  # Prediction ledger
  ledger: data/ledger/predictions.csv

  # Evaluation and drift reports
  reports: data/reports

  # Logs
  logs: logs

  # Champion / Challenger registry
  model_registry: data/model_registry.json


# ============================================================
# UNIVERSE
# ============================================================

universes:

  primary:
    - nifty50

  secondary:
    - niftynext50

  enabled:
    nifty50: true
    niftynext50: false
    midcap150: false
    smallcap250: false


# ============================================================
# MARKET DATA
# ============================================================

data:

  provider: yahoo

  yahoo:

    enabled: true
    period: 1y
    interval: 1d
    auto_adjust: false

  nse:

    enabled: true
    validate_symbols: true

  retries: 3
  retry_delay_seconds: 2
  timeout_seconds: 20
  cache_enabled: true


# ============================================================
# DATA VALIDATION
# ============================================================

validation:

  enabled: true
  minimum_history_days: 120
  minimum_latest_price: 1.0
  allow_missing_volume: false
  maximum_missing_ratio: 0.05
  reject_duplicate_dates: true
  reject_negative_prices: true
  reject_invalid_ohlc: true


# ============================================================
# MARKET REGIME
# ============================================================

market_regime:

  enabled: true

  symbol: "^NSEI"

  period: 1y

  fast_ma: 20
  slow_ma: 50
  long_ma: 200

  volatility_window: 20

  trend_threshold: 0.02
  volatility_threshold: 0.03
  confidence_threshold: 0.50


# ============================================================
# TECHNICAL ANALYSIS
# ============================================================

technical:

  enabled: true

  sma_short: 20
  sma_medium: 50
  sma_long: 200

  ema_short: 12
  ema_long: 26

  rsi_period: 14

  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

  atr_period: 14
  volume_window: 20


# ============================================================
# FUNDAMENTAL ANALYSIS
# ============================================================

fundamental:

  enabled: true

  use_pe_ratio: true
  use_market_cap: true
  use_profitability: true
  use_revenue_growth: true
  use_debt: true

  minimum_market_cap: 0


# ============================================================
# NEWS / SENTIMENT
# ============================================================

sentiment:

  enabled: true

  max_articles: 10
  lookback_days: 3
  minimum_articles: 1

  positive_threshold: 0.15
  negative_threshold: -0.15
  neutral_threshold: 0.05


# ============================================================
# FEATURE ENGINE
# ============================================================

features:

  enabled: true

  history_period: 1y

  minimum_history_rows: 120
  minimum_quality_score: 0.85

  drop_rows_with_nan: true
  replace_infinity: true
  normalize_features: true

  feature_version: "v1"


# ============================================================
# MACHINE LEARNING
# ============================================================

ml:

  enabled: true

  training_period: 5y
  training_limit: 5

  minimum_training_rows: 150

  retrain_enabled: true

  random_state: 42
  n_jobs: -1

  prediction_horizon_days: 1
  prediction_period: 1y

  test_size: 0.20
  validation_size: 0.10

  shuffle_training_data: false


# ============================================================
# RETURN MODEL
# ============================================================

return_model:

  enabled: true

  algorithm: random_forest

  n_estimators: 300
  max_depth: 8
  min_samples_split: 5
  min_samples_leaf: 2


# ============================================================
# DIRECTION MODEL
# ============================================================

direction_model:

  enabled: true

  algorithm: random_forest

  n_estimators: 300
  max_depth: 8
  min_samples_split: 5
  min_samples_leaf: 2

  probability_threshold: 0.50


# ============================================================
# RISK MODEL
# ============================================================

risk_model:

  enabled: true

  algorithm: random_forest

  n_estimators: 250
  max_depth: 8
  min_samples_split: 5
  min_samples_leaf: 2


# ============================================================
# ENSEMBLE MODEL
# ============================================================

ensemble:

  enabled: true

  return_weight: 0.40
  direction_weight: 0.35
  risk_weight: 0.25

  normalize_outputs: true


# ============================================================
# CONFIDENCE
# ============================================================

confidence:

  enabled: true

  minimum_confidence: 0.20

  high_confidence: 0.75
  medium_confidence: 0.50
  low_confidence: 0.20


# ============================================================
# OPPORTUNITY SCORE
# ============================================================

opportunity:

  enabled: true

  return_weight: 0.40
  probability_weight: 0.30
  risk_weight: 0.20
  confidence_weight: 0.10

  minimum_score: 0.20


# ============================================================
# SCORING
# ============================================================

scoring:

  enabled: true

  prefilter_top: 40

  technical_weight: 0.25
  opportunity_weight: 0.40
  confidence_weight: 0.20
  feature_quality_weight: 0.15

  minimum_score: 0.20


# ============================================================
# QUALITY GATE
# ============================================================

quality_gate:

  enabled: true

  minimum_feature_quality: 0.85
  minimum_confidence: 0.20
  minimum_opportunity_score: 0.20

  reject_missing_prediction: true


# ============================================================
# SECTOR DIVERSIFICATION
# ============================================================

diversification:

  enabled: true

  max_per_sector: 2
  max_per_industry: 2

  unknown_sector_allowed: true


# ============================================================
# FINAL OUTPUT
# ============================================================

top_n: 5


# ============================================================
# OHLC PREDICTION
# ============================================================

ohlc:

  enabled: true

  prediction_horizon_days: 1
  minimum_history_days: 60

  validate_prediction: true
  require_valid_range: true


# ============================================================
# PREDICTION LEDGER
# ============================================================

ledger:

  enabled: true

  store_current_close: true
  store_market_regime: true
  store_model_version: true
  store_feature_version: true
  store_confidence: true
  store_opportunity_score: true
  store_probability: true
  store_risk: true

  evaluation_status_column: evaluation_status

  pending_status: PENDING
  evaluated_status: EVALUATED


# ============================================================
# MODEL EVALUATION
# ============================================================

evaluation:

  enabled: true

  evaluation_hour: 16

  recent_window: 50

  calculate_return_mae: true
  calculate_direction_accuracy: true
  calculate_brier_score: true
  calculate_probability_error: true
  calculate_risk_mae: true
  calculate_ohlc_mae: true

  save_reports: true


# ============================================================
# DRIFT DETECTION
# ============================================================

drift:

  enabled: true

  recent_window: 20

  minimum_history: 30

  maximum_baseline_multiplier: 5

  return_mae_threshold: 0.30
  direction_accuracy_threshold: 0.10
  brier_score_threshold: 0.20
  risk_mae_threshold: 0.30

  warning_threshold: 1.0
  drift_threshold: 2.0
  critical_threshold: 3.0

  notify_on_warning: false
  notify_on_drift: true
  notify_on_critical: true

  recommend_retraining: true
  enable_challenger: true


# ============================================================
# CHAMPION / CHALLENGER
# ============================================================

champion_challenger:

  enabled: true

  champion: current

  challenger: challenger_v1

  minimum_evaluations: 30

  comparison_window: 50

  minimum_improvement: 0.02

  evaluate_return_mae: true
  evaluate_direction_accuracy: true
  evaluate_brier_score: true
  evaluate_risk_mae: true

  auto_promote: false

  require_manual_approval: true


# ============================================================
# AUTOMATIC RETRAINING
# ============================================================

retraining:

  enabled: true

  retrain_on_warning: false

  retrain_on_drift: true

  retrain_on_critical: true

  challenger_prefix: challenger

  training_timeout_seconds: 7200


# ============================================================
# PARALLEL PREDICTION
# ============================================================

parallel_prediction:

  enabled: true

  registry_path: data/model_registry.json

  # Champion predictions are handled by morning_job.py
  run_champion: false

  # Challenger models run in shadow mode
  run_challengers: true

  champion_name: current

  # Run only the newest active Challenger
  max_active_challengers: 1

  ledger_path: data/ledger/predictions.csv


# ============================================================
# MODEL STORE
# ============================================================

model_store:

  enabled: true

  path: data/models

  save_metadata: true
  save_training_metrics: true
  save_feature_version: true
  save_training_timestamp: true

  overwrite_existing: true


# ============================================================
# TRAINING SCHEDULE
# ============================================================

training:

  enabled: true

  full_retrain_days: 30

  retrain_on_drift: true
  retrain_on_critical_drift: true

  minimum_days_between_retraining: 7

  training_batch_size: 10


# ============================================================
# INDEX PREDICTIONS
# ============================================================

indexes:

  enabled: true

  symbols:

    - "^NSEI"
    - "^NSEBANK"

  period: 1y

  prediction_horizon_days: 1


# ============================================================
# IPO WATCHLIST
# ============================================================

ipo:

  enabled: true

  include_upcoming: true
  include_recent_listings: true

  maximum_items: 5


# ============================================================
# TELEGRAM
# ============================================================

telegram:

  enabled: true

  parse_mode: Markdown

  send_predictions: true
  send_evaluation_report: false
  send_drift_warning: true
  send_training_status: true

  max_message_length: 4000


# ============================================================
# SCHEDULING
# ============================================================

schedule:

  morning_job:

    enabled: true

    hour: 8
    minute: 0

  evaluation_job:

    enabled: true

    hour: 16
    minute: 0

  drift_job:

    enabled: true

    hour: 16
    minute: 15

  training_job:

    enabled: true

    day_of_week: sunday

    hour: 10
    minute: 0


# ============================================================
# LOGGING
# ============================================================

logging:

  level: INFO

  file_enabled: true

  filename: logs/stock_predictor.log

  max_bytes: 10485760

  backup_count: 5


# ============================================================
# DEVELOPMENT / DEBUG
# ============================================================

debug:

  enabled: false

  log_feature_columns: false
  log_model_predictions: false
  log_raw_data: false

  save_intermediate_results: false
