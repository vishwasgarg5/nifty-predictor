# ============================================================
# MARKET PREDICTION SYSTEM CONFIGURATION
# ============================================================


# ============================================================
# PATHS
# ============================================================

paths:

  data_dir: data

  universes_dir: data/universes

  models_dir: data/models

  artifacts_dir: data/artifacts

  logs_dir: data/logs

  reports_dir: data/reports

  prediction_ledger: data/ledger/predictions.csv

  ledger: data/ledger/predictions.csv


# ============================================================
# MARKET UNIVERSE
# ============================================================

universes:

  primary:

    - nifty100

  secondary: []

  include_ipo: false


# ============================================================
# PREDICTION
# ============================================================

prediction:

  top_n: 5

  minimum_confidence: 0.0

  minimum_opportunity_score: 0.0


# ============================================================
# EVALUATION
# ============================================================

evaluation:

  horizon_days: 1

  price_source: yahoo


# ============================================================
# DATA
# ============================================================

data:

  prediction_ledger: data/ledger/predictions.csv

  ledger: data/ledger/predictions.csv


# ============================================================
# TELEGRAM
# ============================================================

telegram:

  enabled: true

  bot_token: null

  chat_id: null


# ============================================================
# MONITORING
# ============================================================

monitoring:

  enabled: true

  minimum_health_score: 50

  warning_health_score: 70


# ============================================================
# CIRCUIT BREAKER
# ============================================================

circuit_breaker:

  enabled: true

  failure_threshold: 3

  cooldown_minutes: 60

  minimum_health_score: 50


# ============================================================
# MODEL
# ============================================================

model:

  name: default

  version: production


# ============================================================
# LOGGING
# ============================================================

logging:

  level: INFO
