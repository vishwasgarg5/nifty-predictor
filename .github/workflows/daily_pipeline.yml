name: Daily Market Prediction Pipeline

on:

  workflow_dispatch:

  schedule:

    # Runs Monday to Friday.
    #
    # 03:30 UTC = 09:00 AM IST
    #
    # GitHub Actions cron always uses UTC.
    - cron: "30 3 * * 1-5"


permissions:
  contents: write


jobs:

  daily-pipeline:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ======================================================
      # DEPENDENCY CACHE
      # ======================================================

      - name: Cache Python dependencies
        uses: actions/cache@v4

        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # CREATE REQUIRED DIRECTORIES
      # ======================================================

      - name: Create data directories
        run: |
          mkdir -p data/ledger
          mkdir -p data/models
          mkdir -p data/monitoring


      # ======================================================
      # MORNING PREDICTION PIPELINE
      # ======================================================

      - name: Run Morning Prediction Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python scripts/morning_job.py


      # ======================================================
      # ACTUAL OUTCOME EVALUATION
      # ======================================================

      - name: Resolve Actual Market Outcomes
        run: |
          python scripts/evaluation_job.py


      # ======================================================
      # PRODUCTION MONITORING
      # ======================================================

      - name: Run Production Monitoring
        run: |
          python src/monitoring.py


      # ======================================================
      # CHAMPION / CHALLENGER
      # ======================================================

      - name: Run Champion Challenger Evaluation
        run: |
          python scripts/champion_challenger_job.py


      # ======================================================
      # SAVE GENERATED DATA
      # ======================================================

      - name: Commit pipeline data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/ledger/predictions.csv \
            data/models \
            data/monitoring \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update market prediction pipeline data"
            git push
          fi
