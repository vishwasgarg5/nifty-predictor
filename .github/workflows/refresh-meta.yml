name: Auto Meta Refresh (Holidays + IPO GMP)

on:
  schedule:
    # ~08:00 IST daily
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas requests lxml html5lib pyyaml python-dotenv

      - name: Refresh holidays + IPO GMP
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/refresh_meta.py

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: auto refresh holidays + IPO GMP"
          file_pattern: |
            data/holidays.json
            data/ipo_pipeline.csv
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
