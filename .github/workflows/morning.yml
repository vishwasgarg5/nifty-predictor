name: Morning - Stocks Indexes IPO

on:
  schedule:
    - cron: "15 3 * * 1-5"   # ~08:45 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run morning job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_MORNING: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          mkdir -p data/predictions models
          python scripts/morning_job.py

      - name: Upload predictions artifact
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_id }}
          path: |
            data/predictions/
            models/
          if-no-files-found: ignore
          retention-days: 14

      - name: Sync main before commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main || true

      - name: Commit predictions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: morning predictions ${{ github.run_id }}"
          file_pattern: |
            data/predictions/*.csv
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
