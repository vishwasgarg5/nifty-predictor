name: Morning - Top 5 Prediction + Sentiment

on:
  schedule:
    # 08:45 IST = 03:15 UTC (Monday to Friday)
    - cron: '15 3 * * 1-5'
  workflow_dispatch:          # Manual trigger for testing

jobs:
  morning-job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create necessary directories
        run: |
          mkdir -p data/predictions data/history models

      - name: Download previous models (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: models
          path: models

      - name: Run Morning Job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/morning_job.py

      - name: Upload models + predictions
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: |
            models/
            data/predictions/
          retention-days: 14

      - name: Commit prediction history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: morning predictions ${{ github.run_id }}"
          file_pattern: "data/predictions/*.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
