name: Evening - Actual vs Predicted

on:
  schedule:
    - cron: "45 10 * * 1-5"  # ~16:15 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evening job
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p data/history data/predictions
          python scripts/evening_job.py

      - name: Sync main before commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main || true

      - name: Commit error history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: evening errors ${{ github.run_id }}"
          file_pattern: |
            data/history/daily_errors.csv
            data/history/*.csv
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
