name: Weekly - Model Precision Report

on:
  schedule:
    # 10:00 IST Saturday = 04:30 UTC Saturday
    - cron: '30 4 * * 6'
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data/history

      - name: Run Weekly Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly_job.py

      - name: Commit weekly summary
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: weekly precision report ${{ github.run_id }}"
          file_pattern: "data/history/weekly_reports.csv"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
